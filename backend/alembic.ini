# Alembic configuration — Phase 1 stub.
# Full database URL and script location are wired in Phase 2
# when SQLAlchemy models and the async engine are introduced.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Set by environment in Phase 2:
# sqlalchemy.url = postgresql+psycopg2://user:pass@host/db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
