name: salesway-backend

x-app: &app
  build:
    context: .
    target: runtime
  image: salesway-backend:local
  environment: &env
    APP_ENV: development
    DATABASE_URL: postgresql+asyncpg://salesway:local-development-password@postgres:5432/salesway
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    WORKER_MODE: celery
    AI_PROVIDER: local
    EMAIL_PROVIDER: local
    CALENDAR_PROVIDER: local
    LIVE_DELIVERY_ENABLED: "false"
    PUBLIC_BASE_URL: http://localhost:8000
    WEBHOOK_SECRET: local-development-webhook-secret
    CORS_ORIGINS: '["http://localhost:4202"]'
    LOG_FORMAT: json
  volumes:
    - mailbox:/app/var/mailbox
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salesway
      POSTGRES_PASSWORD: local-development-password
      POSTGRES_DB: salesway
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesway -d salesway"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: alembic upgrade head
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *app
    command: celery -A app.tasks.celery_app:celery_app beat --loglevel=info --schedule=/app/var/celerybeat-schedule
    volumes:
      - beat_data:/app/var
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  mailbox:
  beat_data:
