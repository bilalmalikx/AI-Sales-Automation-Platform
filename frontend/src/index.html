<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f3f4f8" />
    <title>Salesway · Sales workspace</title>
    <base href="/" />
    <script>
      try {
        let t = JSON.parse(localStorage.getItem('salesway-angular-theme') || '"porcelain"');
        if (!['porcelain', 'midnight', 'system'].includes(t)) t = 'porcelain';
        document.documentElement.dataset.theme =
          t === 'system'
            ? matchMedia('(prefers-color-scheme:dark)').matches
              ? 'midnight'
              : 'porcelain'
            : t;
      } catch (e) {
        document.documentElement.dataset.theme = 'porcelain';
      }
    </script>
    <link rel="preload" href="assets/figtree.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
